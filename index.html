<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#9f0909">
  <title>Satta 786 Result Chart</title>
  <style>
    :root {
      --red: #a90909;
      --deep-red: #8d0505;
      --cream: #fff4d7;
      --ink: #17120d;
      --line: #1d1712;
      --gold: #e8c77a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f2eee6;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }
    .site-header {
      background: linear-gradient(135deg, #760000, #c31313);
      color: white;
      text-align: center;
      padding: 24px 14px 20px;
      border-bottom: 5px solid #e5c57c;
    }
    .site-header h1 {
      margin: 0;
      font-size: clamp(27px, 6vw, 43px);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .site-header p {
      margin: 8px 0 0;
      color: #ffe5a3;
      font: 600 13px Arial, sans-serif;
      letter-spacing: 2px;
    }
    main { width: min(100%, 980px); margin: 18px auto 34px; padding: 0 10px; }
    .section-title {
      text-align: center;
      margin: 24px 0 12px;
      color: var(--deep-red);
      font-size: 25px;
      text-transform: uppercase;
    }
    .today-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 3px;
      background: var(--line);
      border: 3px solid var(--line);
    }
    .result-card {
      min-height: 205px;
      background: var(--cream);
      text-align: center;
      padding: 15px 7px 13px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .result-card.featured {
      grid-column: 1 / -1;
      background: #b90909;
      color: white;
      min-height: 190px;
    }
    .market-name {
      color: #c51b1b;
      font-size: clamp(21px, 4.5vw, 32px);
      font-weight:  bold;
      text-transform: uppercase;
      line-height: 1.1;
    }
    .featured .market-name { color: white; font-size: clamp(27px, 6vw, 40px); }
    .market-time { font-size: clamp(17px, 3.7vw, 25px); font-weight: bold; margin-top: 8px; }
    .yesterday-today { font-family: Arial, sans-serif; font-size: clamp(17px, 3.8vw, 25px); margin: 12px 0; }
    .yesterday-today .dot { color: #d71920; }
    .numbers { font-size: clamp(25px, 5.5vw, 36px); font-weight: bold; white-space: nowrap; }
    .featured .numbers { font-size: clamp(30px, 6vw, 43px); }
    .open-number { color: #161616; }
    .close-number { color: #092fc8; }
    .featured .close-number { color: #fff; }
    .arrow { color: #148b3a; }
    .featured .arrow { color: #fff; }
    .result-date {
      font: 700 13px Arial, sans-serif;
      margin-top: 7px;
      color: #f8e6b9;
    }
    .chart-wrap {
      overflow-x: auto;
      background: white;
      border: 2px solid #211810;
      box-shadow: 0 3px 12px #00000014;
    }
    table {
      width: 100%;
      min-width: 620px;
      border-collapse: collapse;
      text-align: center;
      font-weight: bold;
    }
    th {
      background: #793d20;
      color: white;
      padding: 10px 5px;
      font-size: 14px;
      text-transform: uppercase;
      border: 1px solid #24180f;
      white-space: nowrap;
    }
    td {
      border: 1px solid #2a211a;
      height: 43px;
      padding: 6px 4px;
      font-size: 19px;
    }
    td:first-child {
      color: #b30d0d;
      background: #e8def8;
      font-size: 15px;
      white-space: nowrap;
    }
    .blank { color: #aaa; font-weight: normal; }
    .note {
      text-align: center;
      color: #645b50;
      font: 12px/1.5 Arial, sans-serif;
      margin: 16px 5px 0;
    }
    footer {
      text-align: center;
      background: #2b211a;
      color: #f8e7c4;
      padding: 17px 10px;
      font: 12px Arial, sans-serif;
    }
    @media (max-width: 480px) {
      main { padding: 0 6px; margin-top: 12px; }
      .result-card { min-height: 185px; padding: 13px 4px; }
      .today-grid { gap: 2px; border-width: 2px; }
      .section-title { font-size: 22px; }
      td { height: 40px; }
    }
  </style>
</head>
